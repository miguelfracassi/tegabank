<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Plans · Penny Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2251FF"><script>try{document.documentElement.dataset.theme=localStorage.getItem('tega-theme')==='dark'?'dark':'light'}catch(e){}</script><link rel="stylesheet" href="/style.css">
</head><body><div id="app"></div><script src="/app.js"></script><script>
window.bind = (ctx, render) => {
  const run = async (fn, ok) => { try { await fn(); if (ok) toast(ok); await render(); } catch (e) { toast(e.message, true); render(true); } };
  const goal = id => ctx.goals.find(g => g.id === id), bud = c => ctx.budgets.find(b => b.category === c);
  const flip = (b, on) => { b.classList.toggle('on', on); b.setAttribute('aria-checked', on); };

  document.getElementById('newgoal').onclick = async () => {
    const v = await modal('New goal', [{ name: 'name', label: 'Goal name', ph: 'Holiday, laptop…' }, { name: 'target', label: 'Target (£)', type: 'number', step: '0.01' }], 'Create goal');
    if (v) run(() => api('/api/goals', 'POST', { action: 'create', name: v.name, target: v.target }), 'Goal created');
  };
  document.querySelectorAll('[data-move]').forEach(b => b.onclick = async () => {
    const inn = b.dataset.dir === 'in';
    const v = await modal(inn ? 'Add to goal' : 'Withdraw from goal', [{ name: 'amount', label: 'Amount (£)', type: 'number', step: '0.01' }], inn ? 'Add money' : 'Withdraw');
    if (v) run(() => api('/api/goals', 'POST', { action: 'move', id: b.dataset.move, amount: inn ? +v.amount : -v.amount }), inn ? 'Added to goal' : 'Withdrawn');
  });
  document.querySelectorAll('[data-editg]').forEach(b => b.onclick = async () => {
    const g = goal(b.dataset.editg); if (!g) return;
    const v = await modal('Edit goal', [{ name: 'name', label: 'Goal name', value: g.name }, { name: 'target', label: 'Target (£)', type: 'number', step: '0.01', value: g.target }], 'Save changes');
    if (v) run(() => api('/api/goals', 'POST', { action: 'edit', id: g.id, name: v.name, target: v.target }), 'Goal updated');
  });
  document.querySelectorAll('[data-togg]').forEach(b => b.onclick = () => {
    const g = goal(b.dataset.togg), on = !(g.active !== false); flip(b, on);
    run(() => api('/api/goals', 'POST', { action: 'toggle', id: g.id, active: on }), on ? 'Goal enabled' : 'Goal disabled');
  });
  document.querySelectorAll('[data-delg]').forEach(b => b.onclick = async () => {
    if (!await ask('Delete this goal?', 'Any money saved in it returns to your balance.')) return;
    await leave(b.closest('.item')); run(() => api('/api/goals?id=' + b.dataset.delg, 'DELETE'), 'Goal deleted');
  });

  document.getElementById('newbud').onclick = async () => {
    const v = await modal('Set a budget', [{ name: 'category', label: 'Category', options: EXP }, { name: 'amount', label: 'Monthly limit (£)', type: 'number', step: '0.01' }], 'Save budget');
    if (v) run(() => api('/api/budgets', 'POST', { category: v.category, amount: v.amount }), 'Budget saved');
  };
  document.querySelectorAll('[data-editb]').forEach(b => b.onclick = async () => {
    const x = bud(b.dataset.editb); if (!x) return;
    const v = await modal('Edit budget', [{ name: 'category', label: 'Category', options: EXP.includes(x.category) ? EXP : [...EXP, x.category], value: x.category }, { name: 'amount', label: 'Monthly limit (£)', type: 'number', step: '0.01', value: x.amount }], 'Save changes');
    if (v) run(() => api('/api/budgets', 'POST', { action: 'edit', old: x.category, category: v.category, amount: v.amount }), 'Budget updated');
  });
  document.querySelectorAll('[data-togb]').forEach(b => b.onclick = () => {
    const x = bud(b.dataset.togb), on = !(x.active !== false); flip(b, on);
    run(() => api('/api/budgets', 'POST', { action: 'toggle', category: x.category, active: on }), on ? 'Budget enabled' : 'Budget disabled');
  });
  document.querySelectorAll('[data-delb]').forEach(b => b.onclick = async () => {
    if (!await ask('Remove this budget?', 'Your spending is not affected.', 'Remove')) return;
    await leave(b.closest('.item')); run(() => api('/api/budgets?category=' + encodeURIComponent(b.dataset.delb), 'DELETE'), 'Budget removed');
  });
};
boot('plans', ({ tx, goals, budgets }) => {
  const spent = spentByCat(tx), total = goals.reduce((a, g) => a + g.saved, 0);
  const gl = goals.map((g, i) => { const on = isOn(g), p = g.saved / g.target * 100;
    return `<div class="item${on ? '' : ' off'}" style="--i:${i}"><div class="hd"><b>${esc(g.name)}</b><span>${Math.round(p)}%</span></div>${progress(p, g.saved >= g.target ? 'done' : '')}
    <small>${gbp(g.saved)} saved of ${gbp(g.target)}${g.saved >= g.target ? ' · Goal reached' : ' · ' + gbp(g.target - g.saved) + ' to go'}</small>
    <div class="acts">${sw('data-togg', g.id, on)}<span class="sp"></span><button class="txt" data-editg="${g.id}">${svg('edit')}Edit</button><button class="txt bad" data-delg="${g.id}">${svg('trash')}Delete</button></div>
    <div class="btns"><button class="mini" data-move="${g.id}" data-dir="in"${on ? '' : ' disabled'}>Add</button><button class="mini" data-move="${g.id}" data-dir="out"${on ? '' : ' disabled'}>Withdraw</button></div></div>`; }).join('') || '<div class="empty">No goals yet.</div>';
  const bl = budgets.map((b, i) => { const on = isOn(b), s = spent[b.category] || 0, p = s / b.amount * 100;
    return `<div class="item${on ? '' : ' off'}" style="--i:${i}"><div class="hd"><b>${esc(b.category)}</b><span>${gbp(s)} of ${gbp(b.amount)}</span></div>${progress(p, p >= 100 ? 'bad' : p >= 80 ? 'warn' : '')}
    <small>${!on ? 'Disabled · not tracked' : s > b.amount ? gbp(s - b.amount) + ' over budget' : gbp(b.amount - s) + ' left this month'}</small>
    <div class="acts">${sw('data-togb', b.category, on)}<span class="sp"></span><button class="txt" data-editb="${esc(b.category)}">${svg('edit')}Edit</button><button class="txt bad" data-delb="${esc(b.category)}">${svg('trash')}Remove</button></div></div>`; }).join('') || '<div class="empty">No budgets yet.</div>';
  return `<h1 class="page-h">Plans</h1><p class="mute">${goals.length ? gbp(total) + ' set aside in goals' : 'Set goals and budgets to stay on track'}</p>
  <div class="hgrid plans" style="margin-top:22px"><div><div class="sec"><h2>Savings goals</h2></div>${gl}<button class="add" id="newgoal">+ New goal</button></div>
  <div><div class="sec"><h2>Monthly budgets</h2></div>${bl}<button class="add" id="newbud">+ Set a budget</button></div></div>`;
});
</script></body></html>
