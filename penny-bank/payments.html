<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Payments · Penny Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2251FF"><script>try{document.documentElement.dataset.theme=localStorage.getItem('tega-theme')==='dark'?'dark':'light'}catch(e){}</script><link rel="stylesheet" href="/style.css">
</head><body><div id="app"></div><script src="/app.js"></script><script>
let add = new URLSearchParams(location.search).get('modo') === 'add', msg = null;
window.bind = (ctx, render) => {
  document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { add = b.dataset.pay === 'add'; msg = null; render(true); });
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const i = document.querySelector('input[name=amount]'); i.value = b.dataset.q; i.focus(); });
  document.getElementById('payf').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), amt = Math.abs(+f.get('amount')), status = f.get('status') || 'completed';
    if (!add && status === 'completed' && amt > totals(ctx.tx).bal) { msg = ['err', 'Not enough balance for this payment.']; return render(true); }
    const d = f.get('date'); let okk = false;
    try {
      await api('/api/transactions', 'POST', { title: f.get('title'), category: f.get('category'), status, amount: add ? amt : -amt, created_at: d ? new Date(d + 'T12:00:00').toISOString() : undefined });
      msg = ['ok', add ? 'Money added.' : status === 'pending' ? 'Payment saved as pending.' : 'Payment sent.']; toast(msg[1]); okk = true;
    } catch (err) { msg = ['err', err.message]; toast(err.message, true); }
    render(!okk);
  };
};
boot('payments', ({ tx }) => `<h1 class="page-h">Payments</h1><p class="mute">Balance ${gbp(totals(tx).bal)}</p>
<div class="seg"><button data-pay="send" class="${add ? '' : 'on'}">Send</button><button data-pay="add" class="${add ? 'on' : ''}">Add money</button></div>
<form id="payf" class="card"><label>Amount (£)</label><input class="big" name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required>
<div class="quick">${[10, 20, 50, 100, 250].map(n => `<button type="button" data-q="${n}">£${n}</button>`).join('')}</div>
<label>${add ? 'Source' : 'Recipient or description'}</label><input name="title" required>
<label>Category</label><select name="category">${(add ? INC : EXP).map(c => `<option>${c}</option>`).join('')}</select>
<label>Date</label><input name="date" type="date" max="${ymd(new Date())}" value="${ymd(new Date())}">
${add ? '' : '<label>Status</label><select name="status"><option value="completed">Send now</option><option value="pending">Keep as pending</option></select>'}
${msg ? `<p class="msg ${msg[0]}">${esc(msg[1])}</p>` : ''}<button class="cta">${add ? 'Add money' : 'Send payment'}</button></form>`);
</script></body></html>
